name: TWRP Recovery Builder (Tutorial Local Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/ulefone/Armor_15

    - name: Setup Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev xz-utils || true

    - name: Extract Local Precompiled TWRP Source
      run: |
        cd $HOME
        mkdir twrp
        
        # Der Server holt sich deine Datei jetzt direkt von deiner eigenen Release-Seite ohne fremde Hürden
        curl -LJ "https://github.com" -o $HOME/twrp.tar.xz
        
        # Jetzt läuft das Entpacken zu 100% ohne Formatfehler durch
        tar -xJf $HOME/twrp.tar.xz --directory $HOME/twrp/
        rm $HOME/twrp.tar.xz
        
        # Verschiebe deinen hochgeladenen Device-Tree an die richtige Stelle im Quellcode
        mv $GITHUB_WORKSPACE/device $HOME/twrp/

    - name: Build TWRP Image
      run: |
        cd $HOME/twrp
        source build/envsetup.sh
        lunch omni_Armor_15-eng
        make -j$(nproc) bootimage

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Boot-Image-Armor15
        path: /home/runner/twrp/out/target/product/Armor_15/boot.img
