name: TWRP Recovery Builder 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/ulefone/Armor_15

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Download TWRP Minimal Manifest
      run: |
        mkdir twrp_source && cd twrp_source
        repo init -u https://github.com -b twrp-12.1 --depth=1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
        mv ../device .

    - name: Build TWRP Boot Image
      run: |
        cd twrp_source
        source build/envsetup.sh
        lunch omni_Armor_15-eng
        make bootimage -j$(nproc)

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Boot-Image-Armor15
        path: twrp_source/out/target/product/Armor_15/boot.img
