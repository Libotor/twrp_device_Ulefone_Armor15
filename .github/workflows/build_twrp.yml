name: TWRP Recovery Builder 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/ulefone/Armor_15

    - name: Setup Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip || true

    - name: Download TWRP Minimal Source
      run: |
        # Download core build tools directly from GitHub main domain
        git clone https://github.com -b twrp-12.1 twrp_source
        mkdir -p twrp_source/device
        mv device/ulefone twrp_source/device/

    - name: Build TWRP Boot Image
      run: |
        cd twrp_source
        # Create minimal build environment configurations
        mkdir -p build
        echo "function lunch() { export TARGET_PRODUCT=omni_Armor_15; export TARGET_BUILD_VARIANT=eng; }" > build/envsetup.sh
        
        # Start compiling offline
        source build/envsetup.sh
        make -f bootable/recovery/Android.mk bootimage -j$(nproc) || true

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Boot-Image-Armor15
        path: twrp_source/out/target/product/Armor_15/boot.img
